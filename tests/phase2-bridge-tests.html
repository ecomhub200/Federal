class CrashLensDataClient {
  static DEFAULTS = {
    supabaseUrl: 'https://srv1503081.hstgr.cloud/rest/v1',
    supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc0OTEyNDczLCJleHAiOjIwOTAyNzI0NzN9.5arUDeH3ccQ9O-UK57wFu7w1jKaIoIq3uroqithXjQs',
    r2BaseUrl: 'https://data.aicreatesai.com',
    timeout: 15000, mapLimit: 5000, pageSize: 25, preferSupabase: true,
  };
  constructor(opts = {}) {
    this.supabaseUrl = opts.supabaseUrl || CrashLensDataClient.DEFAULTS.supabaseUrl;
    this.supabaseKey = opts.supabaseKey || CrashLensDataClient.DEFAULTS.supabaseKey;
    this.state = opts.state || 'delaware';
    this.timeout = opts.timeout || 15000;
    this._source = 'none';
  }
  get source() { return this._source; }
  async getSummary(tier, value, filters = {}) {
    const tf = {}; if (this.state) tf.state = `eq.${this.state}`;
    if (tier === 'county' && value) tf.physical_juris_name = `eq.${value}`;
    else if (tier === 'region' && value) tf.dot_district = `eq.${value}`;
    else if (tier === 'mpo' && value) tf.mpo_name = `eq.${value}`;
    const url = new URL(`${this.supabaseUrl}/dashboard_summary`);
    for (const [k,v] of Object.entries(tf)) url.searchParams.set(k, v);
    url.searchParams.set('limit', '100000');
    if (filters.yearFrom && filters.yearTo) url.searchParams.set('and', `(crash_year.gte.${filters.yearFrom},crash_year.lte.${filters.yearTo})`);
    const resp = await fetch(url.toString(), {
      headers: { 'apikey': this.supabaseKey, 'Authorization': `Bearer ${this.supabaseKey}` }
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    this._source = 'supabase';
    return resp.json();
  }
}
CrashLensDataClient.init = function(opts) {
  const c = new CrashLensDataClient(opts);
  window.crashLensClient = c;
  return c;
};

//  TEST FRAMEWORK
// ═══════════════════════════════════════════════════════════
const TESTS = [];
let results = { total: 0, pass: 0, fail: 0 };

function test(name, fn) { TESTS.push({ name, fn }); }
function assert(c, m) { if (!c) throw new Error(m || 'Assertion failed'); }
function assertGt(v, min, m) { assert(v > min, m || `Expected > ${min}, got ${v}`); }
function assertEq(v, exp, m) { assert(v === exp, m || `Expected ${exp}, got ${v}`); }

// ═══════════════════════════════════════════════════════════

// ── 1. Supabase connectivity ──
test('getSummary returns matview data', async () => {
  const data = await crashLensClient.getSummary('state', null);
  assert(Array.isArray(data), 'Expected array');
  assertGt(data.length, 0, 'No rows returned');
  assert(data[0].hasOwnProperty('crash_count'), 'Missing crash_count column');
  assert(data[0].hasOwnProperty('crash_year'), 'Missing crash_year column');
  return `${data.length} matview rows`;
});

// ── 2. Matview has all required columns ──
test('Matview rows have all 10 aggregate columns', async () => {
  const data = await crashLensClient.getSummary('state', null);
  const required = ['crash_count','fatals','serious_injuries','total_injured',
    'ped_crashes','bike_crashes','speed_crashes','alcohol_crashes','night_crashes','animal_crashes'];
  const row = data[0];
  const missing = required.filter(c => !row.hasOwnProperty(c));
  assert(missing.length === 0, `Missing columns: ${missing.join(', ')}`);
  return `All 10 aggregate columns present`;
});

// ── 3. Matview has GROUP BY dimensions ──
test('Matview rows have GROUP BY dimensions', async () => {
  const data = await crashLensClient.getSummary('state', null);
  const dims = ['state','physical_juris_name','crash_year','crash_severity',
    'functional_class','collision_type','area_type'];
  const row = data[0];
  const found = dims.filter(c => row.hasOwnProperty(c));
  return `${found.length}/${dims.length} dimensions: ${found.join(', ')}`;
});

// ── 4. Kent County filter works ──
test('getSummary(county, Kent) returns Kent-only data', async () => {
  const data = await crashLensClient.getSummary('county', 'Kent');
  assertGt(data.length, 0, 'No Kent data');
  const total = data.reduce((s, r) => s + (parseInt(r.crash_count) || 0), 0);
  assertGt(total, 10000, `Kent total too low: ${total}`);
  return `Kent: ${total.toLocaleString()} crashes, ${data.length} rows`;
});

// ── 5. Aggregation: bySeverity ──
test('Aggregation produces correct bySeverity', async () => {
  const data = await crashLensClient.getSummary('county', 'Kent');
  const sev = { K: 0, A: 0, B: 0, C: 0, O: 0 };
  data.forEach(r => {
    const s = (r.crash_severity || '').toUpperCase().charAt(0);
    const c = parseInt(r.crash_count) || 0;
    if (sev.hasOwnProperty(s)) sev[s] += c;
  });
  assertGt(sev.O, sev.A, `O (${sev.O}) should be > A (${sev.A})`);
  assertGt(sev.A, sev.K, `A (${sev.A}) should be > K (${sev.K})`);
  return `K:${sev.K} A:${sev.A} B:${sev.B} C:${sev.C} O:${sev.O}`;
});

  const data = await crashLensClient.getSummary('county', 'Kent');

    const y = parseInt(r.crash_year) || 0;
    if (y > 0) years[y] = (years[y] || 0) + (parseInt(r.crash_count) || 0);
  });
  const sortedYears = Object.keys(years).map(Number).sort();
  assertGt(sortedYears.length, 5, `Too few years: ${sortedYears.length}`);
  assert(sortedYears[0] >= 2009, `First year too early: ${sortedYears[0]}`);
  assert(sortedYears[sortedYears.length - 1] <= 2030, `Last year too late: ${sortedYears[sortedYears.length-1]}`);
  return `Years: ${sortedYears[0]}-${sortedYears[sortedYears.length-1]} (${sortedYears.length} years)`;

// ── 11. EPDO calculation matches data-client ──
test('EPDO calculation matches FHWA 2025 weights', async () => {
  const data = await crashLensClient.getSummary('county', 'Kent');
  const sev = { K: 0, A: 0, B: 0, C: 0, O: 0 };
  data.forEach(r => {
    const s = (r.crash_severity || '').toUpperCase().charAt(0);
    const c = parseInt(r.crash_count) || 0;
    if (sev.hasOwnProperty(s)) sev[s] += c;
  });
  const w = { K: 883, A: 94, B: 21, C: 11, O: 1 };
  const epdo = sev.K * w.K + sev.A * w.A + sev.B * w.B + sev.C * w.C + sev.O * w.O;
  assertGt(epdo, 0, 'EPDO is zero');
  // K component should dominate
  const kComponent = sev.K * w.K;
  assertGt(kComponent / epdo, 0.1, `K component too low: ${(kComponent/epdo*100).toFixed(1)}%`);
  return `EPDO: ${epdo.toLocaleString()} (K=${(kComponent/epdo*100).toFixed(1)}%)`;
});

// ── 15. Functional class table ──

  const sorted = Object.entries(fc).sort((a, b) => b[1] - a[1]);
  const tbody = document.getElementById('funcClassBody');
  let html = '';
  sorted.forEach(([name, count]) => {

  const rows = tbody.querySelectorAll('tr');
  assertGt(rows.length, 2, `Too few FC rows: ${rows.length}`);
  // Verify sorted descending
  if (rows.length >= 2) {
    const first = parseInt(rows[0].cells[1].textContent);
    const second = parseInt(rows[1].cells[1].textContent);
    assert(first >= second, `Not sorted: ${first} < ${second}`);
  }
  return `${rows.length} FC rows, sorted descending`;
});

// ── 16. YoY trend calculation ──
test('YoY trend arrows calculate correctly', async () => {
  const data = await crashLensClient.getSummary('county', 'Kent');
  const byYear = {};
  data.forEach(r => {
    const y = parseInt(r.crash_year) || 0;
    const c = parseInt(r.crash_count) || 0;
    if (y > 0) byYear[y] = (byYear[y] || 0) + c;
  });
  const years = Object.keys(byYear).map(Number).sort();
  assert(years.length >= 2, 'Need at least 2 years for trend');
  const last = byYear[years[years.length - 1]];
  const prev = byYear[years[years.length - 2]];
  const change = ((last - prev) / prev * 100).toFixed(1);
  const arrow = change > 0 ? '↑' : (change < 0 ? '↓' : '→');
  document.getElementById('kpiTotalTrend').textContent = `${arrow} ${Math.abs(change)}%`;
  const trendText = document.getElementById('kpiTotalTrend').textContent;
  assert(trendText.includes('%'), `No % in trend: ${trendText}`);
  return `${years[years.length-2]}→${years[years.length-1]}: ${trendText}`;
});

// ── 2026-05-01: tier-aware road-type matrix ──
test('radioToBucket() Federal "Non-DOT Roads" → 3-bucket array', () => {
  const spec = CrashLensDataClient.radioToBucket('countyPlusVDOT', 'federal');
  assertEq(spec.bucket, null, `expected bucket=null, got ${spec.bucket}`);
  assert(Array.isArray(spec.in) && spec.in.length === 3, `expected 3-bucket array, got ${JSON.stringify(spec.in)}`);
  assertEq(spec.noInterstate, false);
  return `in=[${spec.in.join(',')}]`;
});

test('radioToBucket() local "All Roads (No Interstate)" → noInterstate=true', () => {
  for (const tier of ['mpo','planning_district','county','city']) {
    const spec = CrashLensDataClient.radioToBucket('countyPlusVDOT', tier);
    assertEq(spec.bucket, null, `${tier}: bucket should be null`);
    assertEq(spec.in, null, `${tier}: in should be null`);
    assertEq(spec.noInterstate, true, `${tier}: noInterstate should be true`);
  }
  return '4 local tiers all noInterstate=true';
});

test('radioToBucket() State/Region "County Roads Only" → county_roads bucket', () => {
  for (const tier of ['state', 'region']) {
    const spec = CrashLensDataClient.radioToBucket('countyPlusVDOT', tier);
    assertEq(spec.bucket, 'county_roads', `${tier}: bucket should be county_roads`);
  }
  return 'state + region resolved correctly';
});

test('city_roads bucket — getSummary returns rows', async () => {
  const data = await crashLensClient.getSummary('state', null, { roadType: 'city_roads' });
  assert(Array.isArray(data) && data.length > 0, 'Expected city_roads rows');
  const total = data.reduce((s, r) => s + (parseInt(r.crash_count) || 0), 0);
  assertGt(total, 0, `city_roads total is ${total}`);
  return `${data.length} rows, ${total.toLocaleString()} city-roads crashes`;
});

test('Federal Non-DOT (3-bucket array) totals < DOT-only', async () => {
  const dot = await crashLensClient.getSummary('federal', null, { roadType: 'dot_roads' });
  const non = await crashLensClient.getSummary('federal', null, {
    roadTypes: ['county_roads','city_roads','other_roads']
  });
  const dotTotal = dot.reduce((s, r) => s + (parseInt(r.crash_count) || 0), 0);
  const nonTotal = non.reduce((s, r) => s + (parseInt(r.crash_count) || 0), 0);
  assert(nonTotal > 0 && dotTotal > 0, 'Either bucket empty');
  assert(nonTotal < dotTotal, `non-DOT (${nonTotal}) >= DOT (${dotTotal})`);
  return `non-DOT: ${nonTotal.toLocaleString()}  vs  DOT: ${dotTotal.toLocaleString()}`;
});

// ═══════════════════════════════════════════════════════════
//  TEST RUNNER
// ═══════════════════════════════════════════════════════════
async function runAllTests() {
  const btn = document.getElementById('btnRun');
  btn.disabled = true; btn.textContent = '⏳ Running...';
  results = { total: TESTS.length, pass: 0, fail: 0 };
  const listEl = document.getElementById('testList');
  listEl.innerHTML = '';
  const startTime = Date.now();

  const cards = TESTS.map((t, i) => {
    const div = document.createElement('div');
    div.className = 'test running'; div.id = `test-${i}`;
    div.innerHTML = `<div class="test-head"><span class="test-name">${t.name}</span><span class="test-badge b-run">PENDING</span></div><div class="test-detail"></div>`;
    listEl.appendChild(div);
    return div;
  });

  for (let i = 0; i < TESTS.length; i++) {
    const t = TESTS[i], card = cards[i];
    const detail = card.querySelector('.test-detail');
    const badge = card.querySelector('.test-badge');
    document.getElementById('progBar').style.width = `${(i / TESTS.length) * 100}%`;
    const tStart = Date.now();
    try {
      const msg = await t.fn();
      card.className = 'test pass'; badge.className = 'test-badge b-pass'; badge.textContent = 'PASS';
      detail.innerHTML = `<span class="ok">✓ ${msg || 'OK'}</span> <span style="color:#64748b">${Date.now()-tStart}ms</span>`;
      results.pass++;
    } catch (e) {
      card.className = 'test fail'; badge.className = 'test-badge b-fail'; badge.textContent = 'FAIL';
      detail.innerHTML = `<span class="err">✗ ${e.message}</span> <span style="color:#64748b">${Date.now()-tStart}ms</span>`;
      results.fail++;
    }
    document.getElementById('sTotal').textContent = results.total;
    document.getElementById('sPass').textContent = results.pass;
    document.getElementById('sFail').textContent = results.fail;
    document.getElementById('sTime').textContent = `${((Date.now() - startTime) / 1000).toFixed(1)}s`;
    await new Promise(r => setTimeout(r, 50));
  }
  document.getElementById('progBar').style.width = '100%';
  btn.disabled = false;
  btn.textContent = results.fail > 0 ? '❌ Re-run' : '✅ All Passed — Re-run';
}
</script>
